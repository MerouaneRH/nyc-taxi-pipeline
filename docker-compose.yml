x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-nyc-taxi-airflow:2.10.5}
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?set in .env}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?set in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    # fixed: the mounted .aws-airflow holds only this profile
    AWS_PROFILE: nyc-taxi
    AWS_REGION: ${AWS_REGION:-eu-west-3}
    AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-3}
    S3_BUCKET: ${S3_BUCKET:-merouane-nyc-taxi-raw-euw3-2026}
    AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials
    AWS_CONFIG_FILE: /home/airflow/.aws/config
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./ingestion:/opt/project/ingestion:ro
    - ./dbt:/opt/project/dbt:ro
    - ./pyproject.toml:/opt/project/pyproject.toml:ro
    # holds only the nyc-taxi profile (copy it from ~/.aws), not every host profile
    - ./.aws-airflow:/home/airflow/.aws:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users list | grep -qw "$${AIRFLOW_ADMIN_USER}" ||
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Admin --lastname User --role Admin --email admin@example.com)
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Streamlit app: app/ exists (app/main.py). Uncomment to run it on :8501.
  # The image runs as uid 10001 with no home dir, so point the AWS SDK at the mount.
  # streamlit:
  #   build:
  #     context: .
  #     dockerfile: docker/streamlit.Dockerfile
  #   environment:
  #     AWS_PROFILE: nyc-taxi
  #     AWS_REGION: ${AWS_REGION:-eu-west-3}
  #     S3_BUCKET: ${S3_BUCKET:-merouane-nyc-taxi-raw-euw3-2026}
  #     HOME: /tmp
  #     AWS_SHARED_CREDENTIALS_FILE: /opt/aws/credentials
  #     AWS_CONFIG_FILE: /opt/aws/config
  #   volumes:
  #     - .:/opt/project:ro
  #     # world-readable copy needed: container uid 10001 must be able to read the files
  #     - ./.aws-airflow:/opt/aws:ro
  #   ports:
  #     - "127.0.0.1:8501:8501"

volumes:
  postgres-db:
