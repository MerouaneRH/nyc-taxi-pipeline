name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: [models]
seed-paths: [seeds]
snapshot-paths: [snapshots]
macro-paths: [macros]
test-paths: [tests]

vars:
  raw_database: nyc_taxi_raw
  # Hard cap on scanned partitions (cost control). Override: --vars '{min_year: 2023}'
  min_year: 2024
  max_year: 2024
  # Data-quality thresholds for dq_suspect_trips (judgment calls, tune here)
  dq_distance_absurd_miles: 100
  dq_speed_max_mph: 100
  dq_short_trip_seconds: 60
  dq_short_trip_min_miles: 1
  dq_zero_distance_min_fare: 10
  dq_long_trip_minutes: 720

models:
  nyc_taxi:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +table_type: hive
      +format: parquet

seeds:
  nyc_taxi:
    +table_type: hive
