version: 2
models:
  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [not_null, unique]
  - name: fct_trips
    columns:
      - name: trip_id
        data_tests: [not_null, unique]
      - name: vendor_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('dim_vendor')", field: vendor_id}}
      - name: pickup_zone_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('dim_zone')", field: zone_id}}
      - name: dropoff_zone_id
        data_tests:
          - relationships: {arguments: {to: "ref('dim_zone')", field: zone_id}}
      - name: payment_type
        data_tests:
          - accepted_values: {arguments: {values: [0, 1, 2, 3, 4, 5, 6], quote: false}}
      - name: trip_duration_min
        data_tests: [not_null]
  - name: mart_daily_zone_revenue
    columns:
      - name: pickup_date
        data_tests: [not_null]
