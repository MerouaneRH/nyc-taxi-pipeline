name: dbt-build
# Runs the real dbt build on Athena. Not triggered by pull requests: forks must
# never reach AWS. Credentials come from GitHub OIDC (no stored keys); the role
# ARN lives in the repository variable AWS_DBT_ROLE_ARN.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-build.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dbt-build
  cancel-in-progress: false

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: uv sync --frozen --group dbt
      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DBT_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Raw tables and seed
        working-directory: dbt
        run: |
          uv run --frozen --group dbt dbt run-operation create_raw_tables --profiles-dir . --target ci
          uv run --frozen --group dbt dbt seed --profiles-dir . --target ci
      - name: Snapshot
        working-directory: dbt
        run: uv run --frozen --group dbt dbt snapshot --profiles-dir . --target ci
      - name: Build and test
        working-directory: dbt
        run: |
          # min_year..max_year must cover every loaded year: mart_month_quality is a table
          # that reads raw over that range. run_month limits each incremental model to one
          # month (a fast check, not a rebuild of the whole history).
          uv run --frozen --group dbt dbt build --profiles-dir . --target ci \
            --vars "{min_year: 2024, max_year: $(date -u +%Y), run_month: \"2024-01\"}"
