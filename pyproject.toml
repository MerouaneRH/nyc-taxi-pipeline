[project]
name = "nyc-taxi-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.121",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas<3",
    "pyarrow>=26.0.0",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.17.2",
]
dbt = [
    "boto3>=1.43.121",
    "dbt-athena-community>=1.11.1",
    "dbt-core>=1.12.6",
]
app = [
    "boto3>=1.43.121",
    "pandas>=2.3.3",
    "streamlit>=1.66.1",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["BLE001"]
